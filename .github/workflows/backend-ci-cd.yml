name: CI for Backend

on:
  push:
    branches:
      - main
      - local-dev
    paths:
      - "api/**"
  workflow_dispatch:

jobs:
  build:  
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v5
      - name: Node initialization
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Intall dependencies
        working-directory: api
        run: npm install
      - name: Build
        run: npm run build
  test:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v5
      - name: Node initialization
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Intall dependencies
        working-directory: api
        run: npm install
      - name: Test
        run: npm run test

  deploy:
    runs-on: ubuntu-latest  
    needs: build
    steps:
      - name: Deploy
        run: echo "Deploying.....!!"