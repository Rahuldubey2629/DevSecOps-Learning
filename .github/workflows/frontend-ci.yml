name: CI for Frontend

on:
  push:
    branches:
      - main
      - local-dev
    paths:
      - "client/**"
      
  workflow_dispatch:

jobs:
  build:  
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v5
      - name: Node initialization
        uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: client
        run: npm ci
  
  deploy:
    runs-on: ubuntu-latest  
    needs: build

    steps:
      - name: Deploy
        run: echo "Deploying .....!!"