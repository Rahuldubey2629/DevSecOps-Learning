version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: dev_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Rahul
      MYSQL_DATABASE: crud_app
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: ["--default-authentication-plugin=mysql_native_password"]

volumes:
  mysql-data:
